apis:
- name: Solsten API
  description: >-
    REST API for the Solsten assessment and persona platform. Documented operations cover listing users who completed an
    assessment (paged, 500 per page, one-hour cache), checking a single user's assessment status, reading assessment
    metadata and completion statistics, permanently deleting a user's data on request, and fetching the user IDs that
    belong to a segment/persona. A PlayFab webhook endpoint accepts inbound gameplay events. Authentication is a Bearer
    API key issued per dashboard. No OpenAPI or other machine-readable contract is published.
  humanURL: https://docs.api.solsten.io/
  baseURL: https://api.solsten.io/v1
