aid: 12traits
name: Solsten
description: >-
  Solsten (originally 12traits) is a Berlin- and Minneapolis-based psychological-AI company that builds audience
  intelligence for product, marketing and research teams, pairing validated psychographic measurement with behavioural
  telemetry to model how real people think, decide and engage. Its product suite spans Traits (assessment-driven
  psychographic personas for a company's real customers), Navigator (a library of 200,000+ pre-profiled audiences drawn
  from 2M+ questionnaire respondents) and Elaris (audience-aware generative content). The public developer surface is a
  small REST API at api.solsten.io covering assessment completion, per-user assessment status, segment/persona user
  lists and GDPR-style user-data deletion, plus a documented Microsoft Azure PlayFab webhook and a cloud-object-storage
  bulk ingestion contract for behavioural events and KPIs.
