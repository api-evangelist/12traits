  status: 200
- type: help-center
  url: https://help.solsten.io/en/
  status: 0
  note: >-
    A Solsten help center is indexed by search engines at this hostname, but the host currently fails
    the TLS handshake (SSLV3_ALERT_HANDSHAKE_FAILURE) from two independent clients, so it is not
    reachable and is deliberately NOT wired as a Support pointer.
resource_lifecycle:
- resource: assessment
  states:
  - Launched
  - Closed
  - Deleted
  detail: >-
    GET /v1/assessment returns a `status` field. "Possible assessment statuses are: Launched, Closed,
    Deleted."
  evidence: https://docs.api.solsten.io/#assessment-info
- resource: user data
  states:
  - present
  - deleted
  detail: >-
    DELETE /v1/userData removes a user permanently; propagation is documented as taking "a few
    minutes". No restore path — see conventions/12traits-conventions.yml reversibility.
  evidence: https://docs.api.solsten.io/#delete-user
