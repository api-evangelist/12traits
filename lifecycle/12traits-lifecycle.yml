generated: '2026-09-05'
method: searched
source: https://docs.api.solsten.io/
name: Solsten API lifecycle
summary: >-
  The API is versioned in the path at v1 and nothing else about its lifecycle is published. There is
  no changelog, no release notes, no deprecation or sunset policy, no SLA, and no status page — the
  conventional status.solsten.io hostname does not resolve. Solsten does publish enumerated lifecycle
  states for the assessment resource itself (Launched, Closed, Deleted), which is the only lifecycle
  vocabulary in the reference.
versioning:
  style: path
  current_version: v1
  format: https://api.solsten.io/v1/...
  policy_documented: false
  breaking_change_policy: null
  evidence: https://docs.api.solsten.io/#authentication
change_log:
  present: false
  url: null
  evidence:
  - url: https://solsten.io/changelog
    status: 404
  note: >-
    The provider's own llms.txt indexes Products, Technology & Data, Solutions, Resources, Company
    and Legal. No changelog or release-notes page is listed.
deprecation_policy:
  present: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: No deprecated operations are marked, and no retirement notice mechanism is documented.
sla:
