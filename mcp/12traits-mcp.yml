candidate_tools:
- name: list_assessment_users
  description: List the users who have completed the assessment, paged 500 at a time.
  rest: GET /v1/assessment/users
  parameters:
  - {name: page, in: query, type: integer, description: 1-based page number}
  consequence: read
- name: get_user_assessment_status
  description: Check whether one user has completed the assessment, and when.
  rest: GET /v1/assessment/user/status
  parameters:
  - {name: id, in: query, type: string, description: the customer-supplied user identifier}
  consequence: read
- name: get_assessment_info
  description: Read assessment metadata and completion statistics (Partial / Disqualified / Complete).
  rest: GET /v1/assessment
  parameters: []
  consequence: read
- name: list_persona_user_ids
  description: List the user IDs belonging to a segment's persona.
  rest: GET /v1/segments/{SEGMENT_ID}/personas/{PERSONA}/user-ids
  parameters:
  - {name: segment_id, in: path, type: string, description: 'segment id from the dashboard, or "default"'}
  - {name: persona, in: path, type: string, description: '1-based persona index, or "all"'}
  consequence: read
- name: delete_user_data
  description: Permanently delete a user's data. IRREVERSIBLE — no restore path is documented.
  rest: DELETE /v1/userData
  parameters:
  - {name: id, in: body, type: string}
  consequence: destructive
  escalation: human-approval-required
- name: ingest_playfab_event
  description: Deliver a PlayFab gameplay event to Solsten.
  rest: POST /v1/playfab
  parameters:
  - {name: api_key, in: query, type: string}
  consequence: write
  note: >-
    Intended for PlayFab's webhook feature to call, not for an agent. No payload schema is published.
