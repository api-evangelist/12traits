name: Solsten API rate limits
summary: >-
  Solsten publishes no rate limits. The full API reference was read end to end and contains no quota,
  no throttling policy, no 429 status, and no RateLimit-* / X-RateLimit-* / Retry-After response
  header. An honest zero: an integrator cannot tell how fast they may call this API, and an agent
  gets no runtime signal to back off on.
